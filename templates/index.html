<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Club Inventory Manager</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load Lucide Icons (for UI clarity) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Custom scrollbar for inventory list if needed */
        .inventory-scroll { max-height: 80vh; overflow-y: auto; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Club Inventory Manager</h1>
            <p class="text-lg text-gray-500">Add new gear, manage status, and search the inventory.</p>
        </header>

        <!-- Notification Bar (for success/error messages) -->
        <div id="notification-area" class="fixed top-4 right-4 w-full max-w-sm z-50 space-y-2">
            <!-- Notifications will be injected here -->
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- 1. Add New Item Form (Sidebar) -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-2xl font-bold text-indigo-700 mb-6 border-b pb-3 flex items-center">
                    <i data-lucide="plus-circle" class="w-6 h-6 mr-2"></i> Add New Gear
                </h2>

                <form id="add-item-form" enctype="multipart/form-data" class="space-y-4">

                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Gear Name</label>
                        <input type="text" name="name" id="name" required
                            class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-indigo-500 focus:ring-indigo-500 border"
                            placeholder="e.g., Canon 5D Mark IV">
                    </div>

                    <!-- NEW: Category Dropdown -->
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                        <select name="category" id="category" required
                                class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-indigo-500 focus:ring-indigo-500 border bg-white">
                            <option value="" disabled selected>Select a Category</option>
                            <option value="Cameras">Cameras</option>
                            <option value="Lenses">Lenses</option>
                            <option value="Audio">Audio</option>
                            <option value="Lighting">Lighting</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>

                    <div>
                        <label for="photo" class="block text-sm font-medium text-gray-700">Photo (Optional)</label>
                        <input type="file" name="photo" id="photo" accept="image/*"
                            class="mt-1 block w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-full file:border-0
                            file:text-sm file:font-semibold
                            file:bg-indigo-50 file:text-indigo-700
                            hover:file:bg-indigo-100">
                    </div>

                    <button type="submit" id="submit-button"
                            class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        Add Gear
                    </button>
                </form>
            </div>

            <!-- 2. Inventory List (Main Area) -->
            <div class="lg:col-span-2">

                <!-- Search and Filter Controls -->
                <div class="bg-white p-4 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label for="search-name" class="sr-only">Search by Name</label>
                        <div class="relative">
                            <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-name" onkeyup="filterItems()"
                                class="block w-full rounded-lg border-gray-300 pl-10 pr-4 py-3 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border"
                                placeholder="Search by name...">
                        </div>
                    </div>
                    <div class="w-full md:w-48">
                        <label for="filter-category" class="sr-only">Filter by Category</label>
                        <select id="filter-category" onchange="filterItems()"
                                class="block w-full rounded-lg border-gray-300 shadow-sm p-3 focus:border-indigo-500 focus:ring-indigo-500 border bg-white">
                            <option value="">All Categories</option>
                            <option value="Cameras">Cameras</option>
                            <option value="Lenses">Lenses</option>
                            <option value="Audio">Audio</option>
                            <option value="Lighting">Lighting</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>
                </div>

                <h2 class="text-3xl font-bold text-gray-800 mb-6">Inventory List (<span id="item-count">0</span> Items)</h2>

                <div id="inventory-list" class="space-y-4 inventory-scroll">
                    <!-- Dynamic inventory items will be injected here by JavaScript -->
                    <div id="loading-indicator" class="flex justify-center items-center p-8">
                        <div class="spinner mr-3"></div>
                        <span class="text-lg text-gray-500">Loading inventory...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Global State and Utility Functions ---
        let inventoryData = [];
        const API_URL = '/api/items'; // Flask endpoint to fetch/add/update/delete items
        const UPLOAD_URL = '/upload'; // Flask endpoint for file uploads
        const notificationArea = document.getElementById('notification-area');

        // Converts the icons when the page loads or content is added
        const renderIcons = () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        };

        // Custom notification system
        function showNotification(message, type = 'success') {
            const color = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'check-circle' : 'alert-triangle';

            const notification = document.createElement('div');
            notification.className = `${color} text-white p-4 rounded-lg shadow-xl flex items-center transform transition-all duration-300 ease-out`;
            notification.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 mr-3 flex-shrink-0"></i>
                <span>${message}</span>
            `;

            notificationArea.prepend(notification); // Use prepend to show latest at top

            // Re-render lucide icons in the new notification
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // Slide out after 5 seconds
            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                // Remove from DOM after transition
                notification.addEventListener('transitionend', () => notification.remove());
            }, 5000);
        }

        // --- Data Fetching and Rendering ---

        async function fetchInventory() {
            // NOTE: We only show the list loading indicator before the initial fetch,
            // not after subsequent CRUD operations, to prevent the "null" error.
            const initialLoad = inventoryData.length === 0;
            if (initialLoad) {
                document.getElementById('loading-indicator').style.display = 'flex';
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                // The backend must return a JSON array of items
                const data = await response.json();
                inventoryData = data; // Store full list globally
                renderInventoryList(inventoryData); // Render all items initially
            } catch (error) {
                console.error('Failed to fetch inventory:', error);
                showNotification('Could not load inventory data. Check server connection and API.', 'error');
                document.getElementById('inventory-list').innerHTML = `
                    <p class="text-red-600 p-4 bg-red-50 rounded-lg">Error loading data. Is the /api/items endpoint configured?</p>
                `;
            } finally {
                // Only hide the initial loading indicator
                if (initialLoad) {
                    document.getElementById('loading-indicator').style.display = 'none';
                }
                renderIcons();
            }
        }

        function renderInventoryList(items) {
            const listContainer = document.getElementById('inventory-list');
            const itemCount = document.getElementById('item-count');
            listContainer.innerHTML = '';
            itemCount.textContent = items.length;

            if (items.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg">
                        <p class="font-bold">Inventory is Empty</p>
                        <p>No items match your filters or the inventory is empty. Add a new item!</p>
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const isAvailable = item.status === 'Available';
                const statusClass = isAvailable ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const statusText = isAvailable ? 'Available' : (item.status || 'Unavailable');
                const photoUrl = item.photo_url || 'https://placehold.co/80x80/e0e7ff/4338ca?text=No+Photo';

                const itemHtml = `
                    <div id="item-${item.id}" class="bg-white p-4 flex flex-col sm:flex-row items-start rounded-xl shadow-md hover:shadow-lg transition duration-200 justify-between">

                        <!-- Details & Image -->
                        <div class="flex items-start mb-4 sm:mb-0 flex-grow">
                            <div class="flex-shrink-0 mr-4">
                                <img src="${photoUrl}" 
                                    alt="${item.name}" 
                                    class="w-16 h-16 object-cover rounded-lg border-2 border-gray-100"
                                    onerror="this.onerror=null; this.src='https://placehold.co/80x80/e0e7ff/4338ca?text=No+Photo';">
                            </div>
                            <div>
                                <h3 class="text-xl font-semibold text-gray-900">${item.name}</h3>
                                <p class="text-sm text-gray-500">
                                    Category: <span class="font-medium text-indigo-600">${item.category || 'Uncategorized'}</span>
                                </p>
                            </div>
                        </div>

                        <!-- Actions & Status -->
                        <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2 items-end sm:items-center">

                            <!-- Status Label -->
                            <div class="flex-shrink-0 w-full sm:w-auto text-center sm:text-left">
                                <span id="status-label-${item.id}" class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium ${statusClass}">
                                    ${statusText}
                                </span>
                            </div>

                            <!-- Status Toggle Button -->
                            <button onclick="toggleItemStatus('${item.id}', '${item.status}')"
                                    class="w-full sm:w-auto flex items-center justify-center px-3 py-1.5 border border-transparent rounded-lg text-sm font-medium text-indigo-700 bg-indigo-100 hover:bg-indigo-200 transition duration-150 ease-in-out">
                                <i data-lucide="${isAvailable ? 'arrow-down' : 'arrow-up'}" class="w-4 h-4 mr-1"></i>
                                ${isAvailable ? 'Check Out' : 'Check In'}
                            </button>

                            <!-- Delete Button -->
                            <button onclick="deleteItem('${item.id}', '${item.name}')"
                                    class="w-full sm:w-auto flex items-center justify-center px-3 py-1.5 border border-transparent rounded-lg text-sm font-medium text-red-700 bg-red-100 hover:bg-red-200 transition duration-150 ease-in-out">
                                <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
            renderIcons(); // Render icons after adding new HTML
        }

        // --- Filtering Logic (Client-Side) ---
        function filterItems() {
            const searchName = document.getElementById('search-name').value.toLowerCase();
            const filterCategory = document.getElementById('filter-category').value;

            const filtered = inventoryData.filter(item => {
                const nameMatch = item.name.toLowerCase().includes(searchName);
                const categoryMatch = !filterCategory || item.category === filterCategory;
                return nameMatch && categoryMatch;
            });

            renderInventoryList(filtered);
        }


        // --- CRUD Operations (AJAX) ---

        // 1. Add Item
        document.getElementById('add-item-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);
            const submitButton = document.getElementById('submit-button');
            const originalButtonText = submitButton.innerHTML;

            // Disable button and show spinner
            submitButton.disabled = true;
            submitButton.innerHTML = `<div class="spinner mr-2"></div> Adding...`;

            try {
                // Flask will handle the file upload and Firestore save in one go
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to add item. Status: ' + response.status);
                }

                const newItem = await response.json();

                showNotification(`Successfully added gear: ${newItem.name}!`);

                // Refresh data and UI
                await fetchInventory();

                // Clear the form, but not the category selection
                form.querySelector('#name').value = '';
                form.querySelector('#photo').value = '';

            } catch (error) {
                console.error('Error adding item:', error);
                showNotification(error.message || 'An unknown error occurred while adding the item.', 'error');
            } finally {
                // Re-enable button
                submitButton.disabled = false;
                submitButton.innerHTML = originalButtonText;
            }
        });


        // 2. Toggle Status (Check In/Out)
        async function toggleItemStatus(itemId, currentStatus) {

            const newStatus = currentStatus === 'Available' ? 'Checked Out' : 'Available';
            const actionText = newStatus === 'Available' ? 'Checked In' : 'Checked Out';

            try {
                const response = await fetch(`${API_URL}/${itemId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!response.ok) {
                    throw new Error('Failed to update status.');
                }

                // Update local data and re-render
                await fetchInventory(); 
                showNotification(`Item successfully ${actionText}. New status: ${newStatus}`);

            } catch (error) {
                console.error('Error updating status:', error);
                showNotification('Failed to update item status.', 'error');
            }
        }


        // 3. Delete Item
        async function deleteItem(itemId, itemName) {
            if (!confirm(`Are you sure you want to delete "${itemName}"? This cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${itemId}`, {
                    method: 'DELETE',
                });

                if (!response.ok) {
                    throw new Error('Failed to delete item.');
                }

                // Update local data and re-render
                await fetchInventory();
                showNotification(`Successfully deleted item: ${itemName}.`);

            } catch (error) {
                console.error('Error deleting item:', error);
                showNotification('Failed to delete item.', 'error');
            }
        }

        // --- Initialization ---
        window.onload = function() {
            fetchInventory();
            renderIcons();
        };

        // Expose functions globally for HTML buttons
        window.filterItems = filterItems;
        window.toggleItemStatus = toggleItemStatus;
        window.deleteItem = deleteItem;
        window.confirm = (message) => {
            // Since alert() and confirm() are blocked, we use a simple alternative here.
            // In a full application, you should implement a modal for confirmation.
            return window.prompt(message + " (Type 'YES' to confirm)") === 'YES';
        };

    </script>
</body>
</html>
