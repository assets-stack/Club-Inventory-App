<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MUSOC Inventory Manager</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <style>
            body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
            .available-status { background-color: #d1fae5; color: #065f46; }
            .checked-out-status { background-color: #fee2e2; color: #991b1b; }
            .item-card { transition: all 0.3s ease; }
            .item-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
            .notification { transition: opacity 0.5s ease-in-out; }
        </style>
    </head>
    <body class="min-h-screen p-4 md:p-8">

        <div class="max-w-6xl mx-auto">
            <header class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-2">MUSOC Inventory Manager</h1>
            </header>

            <!-- Notification Bar -->
            <div id="notification-area" class="fixed top-4 right-4 z-50 space-y-3">
                <!-- Notifications will be injected here -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 1. Add New Item Form (Sidebar) -->
                <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Add New Asset</h2>
                    <form id="add-item-form" class="space-y-4">

                        <!-- 1. Primary Asset Type Selector -->
                        <div>
                            <label for="asset_type" class="block text-sm font-medium text-gray-700">Asset Type</label>
                            <select id="asset_type" name="asset_type" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="">-- Select Asset Type --</option>
                                <option value="Costume">Costume</option>
                                <option value="Prop">Prop</option>
                                <option value="Set">Set</option>
                            </select>
                        </div>

                        <!-- 2. Dynamic Fields Container -->
                        <div id="dynamic-fields-container" class="space-y-4 pt-2 border-t border-gray-200">
                            <!-- Fields for selected asset type will be injected here by JS -->
                        </div>

                        <!-- 3. Photo (Shared) -->
                        <div>
                            <label for="photo" class="block text-sm font-medium text-gray-700">Photo (Optional)</label>
                            <input type="file" id="photo" name="photo" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                            <p class="text-xs text-gray-500 mt-1">Uploads will attempt to use GitHub.</p>
                        </div>

                        <button type="submit" id="add-item-button" class="w-full py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition ease-in-out duration-150">
                            Add Asset
                        </button>
                    </form>
                </div>

                <!-- Right Column: Inventory List and Filters -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- Filters and Sort -->
                    <div class="bg-white p-4 rounded-xl shadow-lg flex flex-wrap gap-4 items-center">
                        <div class="flex-grow">
                            <input type="text" id="search-input" placeholder="Search by name, type, or location..." class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div class="flex space-x-2">
                            <button id="view-list-button" class="flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition">
                                <i class="fas fa-list-ul"></i> List
                            </button>
                            <button id="view-grid-button" class="flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition">
                                <i class="fas fa-th"></i> Grid
                            </button>
                        </div>
                        <div>
                            <select id="filter-asset-type" class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="">All Asset Types</option>
                                <option value="Costume">Costume</option>
                                <option value="Prop">Prop</option>
                                <option value="Set">Set</option>
                            </select>
                        </div>
                        <div>
                            <select id="filter-status" class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="">All Statuses</option>
                                <option value="Available">Available</option>
                                <option value="Checked Out">Checked Out</option>
                            </select>
                        </div>
                        <button id="sort-name-button" class="flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition">
                            Sort Name <i class="fas fa-sort-alpha-down ml-1"></i>
                        </button>
                    </div>

                    <!-- Inventory List -->
                    <div class="bg-white p-6 rounded-xl shadow-lg">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Inventory Items</h2>

                        <!-- Loading Indicator -->
                        <div id="loading-indicator" class="hidden justify-center items-center py-12">
                            <i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i>
                            <p class="text-gray-500 ml-3">Loading assets...</p>
                        </div>

                        <!-- Item List Container -->
                        <div id="inventory-list" class="space-y-4">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- JavaScript Logic -->
        <script>
            const API_URL = '/api/items';
            let inventoryData = [];
            let sortDirection = 1; // 1 for ASC, -1 for DESC
            let sizeRowCounter = 0; // For unique IDs for costume size rows
            let currentView = 'list'; // 'list' or 'grid'

            // --- Utility Functions ---

            function showNotification(message, type = 'success') {
                const box = document.getElementById('notification-box');
                const notification = document.createElement('div');

                let bgColor, textColor, icon;

                if (type === 'success') {
                    bgColor = 'bg-green-500';
                    textColor = 'text-white';
                    icon = 'fas fa-check-circle';
                } else if (type === 'error') {
                    bgColor = 'bg-red-600';
                    textColor = 'text-white';
                    icon = 'fas fa-exclamation-triangle';
                } else {
                    bgColor = 'bg-indigo-500';
                    textColor = 'text-white';
                    icon = 'fas fa-info-circle';
                }

                notification.className = `notification p-3 rounded-lg shadow-xl flex items-center ${bgColor} ${textColor} text-sm opacity-100`;
                notification.innerHTML = `
                    <i class="${icon} mr-3"></i>
                    <span>${message}</span>
                `;

                box.prepend(notification); // Add new notifications to the top

                // Automatically remove the notification after 5 seconds
                setTimeout(() => {
                    notification.style.opacity = '0';
                    setTimeout(() => notification.remove(), 500);
                }, 5000);
            }

            // Helper function to render Font Awesome icons for asset types
            function getAssetIcon(assetType) {
                const icons = {
                    'Costume': 'fa-tshirt',
                    'Prop': 'fa-hat-wizard',
                    'Set': 'fa-couch',
                };
                return icons[assetType] || 'fa-box';
            }

            // --- Dynamic Form Rendering ---

            function addCostumeSizeRow() {
                sizeRowCounter++;
                const container = document.getElementById('size-inventory-rows');
                const row = document.createElement('div');
                row.className = 'flex space-x-2 items-end mb-2 border-t pt-2';
                row.id = `size-row-${sizeRowCounter}`;
                row.innerHTML = `
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-gray-600">Size</label>
                        <input type="text" name="size" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-1.5 text-sm border">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-gray-600">Number</label>
                        <input type="number" name="count" required min="1" value="1" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-1.5 text-sm border">
                    </div>
                    <button type="button" onclick="removeCostumeSizeRow('size-row-${sizeRowCounter}')" class="text-red-500 hover:text-red-700 p-1 text-base h-8 w-8 rounded-full">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                container.appendChild(row);
            }

            function removeCostumeSizeRow(rowId) {
                document.getElementById(rowId).remove();
            }

            window.addCostumeSizeRow = addCostumeSizeRow;
            window.removeCostumeSizeRow = removeCostumeSizeRow;

            function displayDynamicFields() {
                const assetType = document.getElementById('asset_type').value;
                const container = document.getElementById('dynamic-fields-container');
                container.innerHTML = '';

                let html = '';
                let requiredFields = true;

                if (assetType === 'Costume') {
                    html = `
                        <div>
                            <label for="type_of_clothing" class="block text-sm font-medium text-gray-700">Type of Clothing</label>
                            <select id="type_of_clothing" name="type_of_clothing" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="Pants">Pants</option>
                                <option value="Shorts">Shorts</option>
                                <option value="Skirt">Skirt</option>
                                <option value="Dress">Dress</option>
                                <option value="Tops">Tops</option>
                                <option value="T_shirt">T-shirt</option>
                                <option value="Long_Sleeve_Shirt">Long Sleeve Shirt</option>
                                <option value="Dress_Shirt">Dress Shirt</option>
                                <option value="Singlet">Singlet</option>
                                <option value="Cardigans_&_Jumpers">Cardigans & Jumpers</option>
                                <option value="Sleepwear_&_Lingerie">Sleepwear & Lingerie</option>
                                <option value="Jackets_&_Coats">Jackets & Coats</option>
                                <option value="Robes">Robes</option>
                            </select>
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                            <select id="gender" name="gender" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="Unisex">Unisex</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="border p-3 rounded-lg bg-gray-50">
                            <label class="block text-sm font-bold text-gray-800 mb-2">Size & Inventory Count</label>
                            <div id="size-inventory-rows">
                                <!-- Initial row -->
                            </div>
                            <button type="button" onclick="addCostumeSizeRow()" class="mt-2 text-indigo-600 hover:text-indigo-800 text-sm font-medium">
                                <i class="fas fa-plus-circle mr-1"></i> Add Size/Number
                            </button>
                        </div>
                        <div>
                            <label for="storage_location" class="block text-sm font-medium text-gray-700">Storage Location</label>
                            <input type="text" id="storage_location" name="storage_location" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                    `;
                } else if (assetType === 'Prop' || assetType === 'Set') {
                    // Prop and Set share Name, Number, and Location
                    html = `
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">${assetType} Name</label>
                            <input type="text" id="name" name="name" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div>
                            <label for="number" class="block text-sm font-medium text-gray-700">Number of Items</label>
                            <input type="number" id="number" name="number" required min="1" value="1" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                        <div>
                            <label for="storage_location" class="block text-sm font-medium text-gray-700">Storage Location</label>
                            <input type="text" id="storage_location" name="storage_location" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        </div>
                    `;
                }

                container.innerHTML = html;

                // Add initial size row for Costumes immediately
                if (assetType === 'Costume') {
                    addCostumeSizeRow();
                }
            }
            document.getElementById('asset_type').addEventListener('change', displayDynamicFields);

            // --- Data Fetching and Rendering ---

            async function fetchInventory() {
                const initialLoad = inventoryData.length === 0;
                const loadingIndicator = document.getElementById('loading-indicator');

                if (initialLoad && loadingIndicator) {
                    loadingIndicator.style.display = 'flex';
                }

                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json(); 
                    inventoryData = data; 
                    filterAndSortInventory(); // Use the consolidated filter/sort function
                } catch (error) {
                    console.error('Failed to fetch inventory:', error);
                    showNotification('Could not load inventory data. Check server connection and API.', 'error');
                    const list = document.getElementById('inventory-list');
                    if (list) {
                        list.innerHTML = `
                            <p class="text-red-600 p-4 bg-red-50 rounded-lg">Error loading data. Is the Flask API running?</p>
                        `;
                    }
                } finally {
                    if (loadingIndicator) {
                        loadingIndicator.style.display = 'none';
                    }
                }
            }

            function renderInventoryList(items) {
                const listContainer = document.getElementById('inventory-list');
                listContainer.innerHTML = '';

                if (currentView === 'grid') {
                    listContainer.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6';
                } else {
                    listContainer.className = 'space-y-4';
                }

                if (items.length === 0) {
                    listContainer.innerHTML = '<p class="text-gray-500 p-4">No items found matching your criteria.</p>';
                    return;
                }

                items.forEach(item => {
                    const isAvailable = item.status === 'Available';
                    const statusClass = isAvailable ? 'available-status' : 'checked-out-status';
                    const buttonText = isAvailable ? 'Check Out' : 'Return';
                    const buttonColor = isAvailable ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-green-600 hover:bg-green-700';

                    let title, description, countInfo;

                    if (item.asset_type === 'Costume') {
                        const totalCount = item.size_inventory
                            ? item.size_inventory.reduce((sum, entry) => sum + parseInt(entry.count || 0), 0)
                            : 0;

                        const sizeDetails = item.size_inventory.map(i => `${i.size} (x${i.count})`).join(', ');

                        title = `${item.type_of_clothing} (${item.gender})`;
                        description = `Location: ${item.storage_location}`;
                        countInfo = `Sizes/Units: ${sizeDetails}`;

                    } else if (item.asset_type === 'Prop' || item.asset_type === 'Set') {
                        title = item.name;
                        description = `Location: ${item.storage_location}`;
                        countInfo = `Quantity: ${item.number}`;
                    }

                    const card = document.createElement('div');
                    if (currentView === 'grid') {
                        card.className = 'item-card bg-white border border-gray-200 rounded-xl shadow-md p-4 flex flex-col items-center text-center';
                    } else {
                        card.className = 'item-card bg-white border border-gray-200 rounded-xl shadow-md p-4 flex items-center space-x-4';
                    }
                    card.innerHTML = `
                        <!-- Photo/Placeholder -->
                        <div class="flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden border border-gray-300">
                            <img src="${item.photo_url || 'https://placehold.co/80x80/cccccc/333333?text=No+Photo'}"
                                alt="${title} photo"
                                class="w-full h-full object-cover"
                                onerror="this.onerror=null;this.src='https://placehold.co/80x80/cccccc/333333?text=No+Photo';">
                        </div>

                        <!-- Item Details -->
                        <div class="${currentView === 'grid' ? 'flex-grow w-full' : 'flex-grow'}">
                            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-700">${item.asset_type}</span>
                            <h3 class="text-lg font-bold text-gray-900 mt-1">${title}</h3>
                            <p class="text-sm text-gray-500">
                                <i class="fas ${getAssetIcon(item.asset_type)} mr-2 text-indigo-500"></i> ${description}
                            </p>
                            <p class="text-sm text-gray-600 font-medium mt-1">${countInfo}</p>
                        </div>

                        <!-- Status Tag -->
                        <span class="px-3 py-1 text-xs font-semibold rounded-full ${statusClass} flex-shrink-0">
                            ${item.status}
                        </span>

                        <!-- Actions -->
                        <div class="flex space-x-2 flex-shrink-0">
                            <button onclick="handleStatusToggle('${item.id}', '${item.status}')"
                                    class="py-1 px-3 text-sm font-medium text-white rounded-lg shadow-sm ${buttonColor} transition ease-in-out duration-150">
                                ${buttonText}
                            </button>
                            <button onclick="handleDelete('${item.id}', '${title}')"
                                    class="py-1 px-3 text-sm font-medium text-red-700 bg-red-100 rounded-lg shadow-sm hover:bg-red-200 transition ease-in-out duration-150">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            function filterAndSortInventory() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                const assetTypeFilter = document.getElementById('filter-asset-type').value;
                const statusFilter = document.getElementById('filter-status').value;

                let filteredItems = inventoryData.filter(item => {
                    // Determine the primary searchable name/identifier
                    const primaryIdentifier = item.asset_type === 'Costume'
                        ? `${item.type_of_clothing} ${item.gender}`
                        : item.name;

                    const nameMatch = primaryIdentifier.toLowerCase().includes(searchTerm) || item.storage_location.toLowerCase().includes(searchTerm);

                    const typeMatch = !assetTypeFilter || item.asset_type === assetTypeFilter;
                    const statusMatch = !statusFilter || item.status === statusFilter;

                    return nameMatch && typeMatch && statusMatch;
                });

                // Apply sorting by primary identifier (name or clothing type)
                filteredItems.sort((a, b) => {
                    const nameA = a.asset_type === 'Costume' ? a.type_of_clothing : a.name;
                    const nameB = b.asset_type === 'Costume' ? b.type_of_clothing : b.name;

                    const valA = (nameA || '').toUpperCase();
                    const valB = (nameB || '').toUpperCase();

                    if (valA < valB) return -1 * sortDirection;
                    if (valA > valB) return 1 * sortDirection;
                    return 0;
                });

                renderInventoryList(filteredItems);
            }

            // --- Event Handlers ---

            // 1. Add Item
            document.getElementById('add-item-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const submitButton = document.getElementById('add-item-button');
                const originalButtonText = submitButton.innerHTML;
                const assetType = formData.get('asset_type');

                if (!assetType) {
                    showNotification('Please select an Asset Type.', 'error');
                    return;
                }

                // Basic validation for Costume Size Inventory
                if (assetType === 'Costume') {
                    const sizes = formData.getAll('size');
                    const counts = formData.getAll('count');
                    if (sizes.length === 0 || sizes.some(s => s.trim() === '') || counts.some(c => parseInt(c) < 1)) {
                        showNotification('Costumes require at least one Size and Number entry, with Number > 0.', 'error');
                        return;
                    }
                }


                submitButton.disabled = true;
                submitButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Adding...`;

                try {
                    // POST to /api/items
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    }

                    const newItem = await response.json();

                    showNotification(`Successfully added asset: ${newItem.asset_type}!`);

                    // Refresh data and UI
                    await fetchInventory();

                    // Clear the form fields and reset dynamic fields
                    form.reset();
                    displayDynamicFields();

                } catch (error) {
                    console.error('Error adding item:', error);
                    showNotification(error.message || 'An unknown error occurred while adding the asset.', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalButtonText;
                }
            });

            // 2. Status Toggle (Check Out/Return)
            async function handleStatusToggle(itemId, currentStatus) {
                const newStatus = currentStatus === 'Available' ? 'Checked Out' : 'Available';

                try {
                    const response = await fetch(`${API_URL}/${itemId}/status`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    }

                    await fetchInventory();
                    showNotification(`Asset status updated to ${newStatus}.`);

                } catch (error) {
                    console.error('Error updating status:', error);
                    showNotification(error.message || 'Failed to update asset status.', 'error');
                }
            }
            window.handleStatusToggle = handleStatusToggle;

            // 3. Delete Item
            async function handleDelete(itemId, itemName) {
                showConfirmationModal(
                'Confirm Deletion',
                `Are you absolutely sure you want to permanently delete "${itemName}"? This action cannot be reversed.`,
                async (confirmed) => {
                    if (!confirmed) return;

                    try {
                        const response = await fetch(`${API_URL}/${itemId}`, {
                            method: 'DELETE'
                        });

                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                            throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                        }

                        await fetchInventory();
                        showNotification(`Successfully deleted asset: ${itemName}.`, 'error');

                    } catch (error) {
                        console.error('Error deleting item:', error);
                        showNotification(error.message || 'Failed to delete asset.', 'error');
                    }
                }
            );
            }
            window.handleDelete = handleDelete;

            // 4. Sort Button
            document.getElementById('sort-name-button').addEventListener('click', () => {
                sortDirection *= -1; // Toggle direction
                const icon = document.querySelector('#sort-name-button i');
                icon.className = sortDirection === 1 ? 'fas fa-sort-alpha-down ml-1' : 'fas fa-sort-alpha-up-alt ml-1';

                filterAndSortInventory();
            });

            // 5. Filters/Search Input
            document.getElementById('search-input').addEventListener('input', filterAndSortInventory);
            document.getElementById('filter-asset-type').addEventListener('change', filterAndSortInventory);
            document.getElementById('filter-status').addEventListener('change', filterAndSortInventory);

            function updateView(view) {
                currentView = view;
                const listButton = document.getElementById('view-list-button');
                const gridButton = document.getElementById('view-grid-button');

                if (view === 'list') {
                    listButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition';
                    gridButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition';
                } else {
                    gridButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition';
                    listButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition';
                }
                filterAndSortInventory(); // Re-render the list with the new view
        }

        document.getElementById('view-list-button').addEventListener('click', () => updateView('list'));
        document.getElementById('view-grid-button').addEventListener('click', () => updateView('grid'));

            // --- Initial Load ---
            fetchInventory();
            displayDynamicFields(); // Initialize form state
    </script>
    </body>
