<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MUSOC Inventory Manager</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <style>
            body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
            .available-status { background-color: #d1fae5; color: #065f46; }
            .checked-out-status { background-color: #fee2e2; color: #991b1b; }
            .item-card { transition: all 0.3s ease; }
            .item-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
            .notification { transition: opacity 0.5s ease-in-out; }

            .grid-photo-container {
                /* Ensures a nice aspect ratio for the photo */
                aspect-ratio: 4/3;
                width: 100%;
                overflow: hidden;
            }
        </style>
    </head>
    <body class="min-h-screen p-4 md:p-8">

        <div class="max-w-6xl mx-auto">
            <header class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-gray-900 mb-2">MUSOC Inventory Manager</h1>
            </header>

            <!-- Notification Bar -->
            <div id="notification-area" class="fixed top-4 right-4 z-50 space-y-3">
                <!-- Notifications will be injected here -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 1. Add New Item Form (Sidebar) -->
                <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Add New Asset</h2>
                    <form id="add-item-form" class="space-y-4">

                        <!-- 1. Primary Asset Type Selector -->
                        <div>
                            <label for="asset_type" class="block text-sm font-medium text-gray-700">Asset Type</label>
                            <select id="asset_type" name="asset_type" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                                <option value="">-- Select Asset Type --</option>
                                <option value="Costume">Costume</option>
                                <option value="Prop">Prop</option>
                                <option value="Set">Set</option>
                                <option value="Tech">Tech</option>
                            </select>
                        </div>

                        <!-- 2. Dynamic Fields Container -->
                        <div id="dynamic-fields-container" class="space-y-4 pt-2 border-t border-gray-200">
                            <!-- Fields for selected asset type will be injected here by JS -->
                        </div>

                        <!-- 3. Photo (Shared) -->
                        <div>
                            <label for="photo" class="block text-sm font-medium text-gray-700">Photo (Optional)</label>
                            <input type="file" id="photo" name="photo" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                            <p class="text-xs text-gray-500 mt-1">Uploads will attempt to use GitHub.</p>
                        </div>

                        <button type="submit" id="add-item-button" class="w-full py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition ease-in-out duration-150">
                            Add Asset
                        </button>
                    </form>
                </div>

                <!-- Right Column: Inventory List and Filters -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- Filters and Sort -->
                    <div class="bg-white p-6 rounded-xl shadow-lg">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
                            <div class="inventory-controls flex flex-wrap gap-3 sm:gap-4 items-end w-full md:w-auto mb-4 md:mb-0">

                                <div class="w-full sm:w-auto">
                                    <label for="filter-asset-type" class="block text-xs font-medium text-gray-700">Asset Type</label>
                                    <select id="filter-asset-type" onchange="displayFilterOptions(); filterAndSortInventory()"
                                            class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white mt-1 w-full md:w-auto">
                                        <option value="All">All Assets</option>
                                        <option value="Costume">Costume</option>
                                        <option value="Prop">Prop</option>
                                        <option value="Set">Set</option>
                                        <option value="Tech">Tech</option>
                                    </select>
                                </div>

                                <div id="dynamic-filters-container" class="flex flex-wrap gap-3 w-full md:w-auto">
                                    </div>

                                <div class="w-full sm:w-auto">
                                    <label for="sort-by-button" class="block text-xs font-medium text-gray-700">Sort By</label>
                                    <select id="sort-by-button" onchange="filterAndSortInventory()"
                                            class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white mt-1 w-full md:w-auto">
                                        <option value="name_asc">Name (A-Z)</option>
                                        <option value="name_desc">Name (Z-A)</option>
                                        <option value="quantity_asc">Quantity (Low to High)</option>
                                        <option value="quantity_desc">Quantity (High to Low)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex space-x-2 w-full md:w-auto justify-start md:justify-end">
                                <button onclick="exportInventory()"
                                        class="flex-shrink-0 py-2 px-3 border border-green-700 rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 transition">
                                    <i class="fas fa-file-excel mr-2"></i>Export to CSV
                                </button>
                                <button id="view-list-button" onclick="updateView('list')"
                                    class="flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition">
                                    <i class="fas fa-list-ul"></i>
                                </button>
                                <button id="view-grid-button" onclick="updateView('grid')"
                                    class="flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition">
                                    <i class="fas fa-th-large"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Inventory List -->
                    <div class="bg-white p-6 rounded-xl shadow-lg">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Inventory Items</h2>

                        <!-- Loading Indicator -->
                        <div id="loading-indicator" class="hidden justify-center items-center py-12">
                            <i class="fas fa-spinner fa-spin text-4xl text-indigo-500"></i>
                            <p class="text-gray-500 ml-3">Loading assets...</p>
                        </div>

                        <!-- Item List Container -->
                        <div id="inventory-list" class="space-y-4">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="detail-modal" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden items-center justify-center p-4 z-50 transition-opacity duration-300">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all sm:my-8 sm:align-middle sm:p-6" role="dialog" aria-modal="true" aria-labelledby="modal-title">

                <div class="flex justify-between items-center border-b pb-3">
                    <h3 id="modal-title" class="text-2xl font-bold text-gray-900">Asset Details</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <form id="edit-item-form" class="py-4 space-y-4">
                    <input type="hidden" id="edit-item-id" name="id">
                    <input type="hidden" id="edit-asset-type" name="asset_type">

                    <div class="flex items-center space-x-4">
                        <div id="modal-photo-container" class="flex-shrink-0 w-24 h-24 rounded-lg overflow-hidden border border-gray-300">
                            <img id="modal-photo" src="" alt="Asset photo" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/96x96/cccccc/333333?text=No+Photo';">
                        </div>
                        <div>
                            <p id="modal-asset-type" class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-700 mb-1"></p>
                            <h4 id="modal-title-main" class="text-xl font-extrabold text-gray-900"></h4>

                            <label for="edit-storage-location" class="block text-xs font-medium text-gray-700 mt-2">Storage Location</label>
                            <input type="text" id="edit-storage-location" name="storage_location" class="w-full text-sm rounded-lg border-gray-300 shadow-sm p-1.5 border bg-white read-mode" disabled>
                        </div>
                    </div>

                    <div id="modal-status-badge" class="px-3 py-1 text-sm font-semibold rounded-full w-fit"></div>

                    <div id="modal-specific-details" class="space-y-2 text-sm text-gray-700 bg-gray-50 p-4 rounded-lg border">
                        <p class="text-md font-semibold text-gray-800 border-b pb-1">Detailed Information:</p>
                        </div>

                    <div id="modal-notes-container" class="text-sm text-gray-600 border-t pt-3">
                        <label for="edit-notes" class="block font-semibold text-gray-800">Notes:</label>
                        <textarea id="edit-notes" name="notes" rows="3" class="w-full mt-1 p-2 bg-yellow-50 rounded-lg border border-yellow-200 read-mode" disabled></textarea>
                    </div>
                </form>

                <div class="mt-4 flex justify-between">
                    <div>
                        <button type="button" id="edit-button" onclick="toggleEditMode(true)" class="py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 transition">
                            <i class="fas fa-edit mr-2"></i>Edit Info
                        </button>
                    </div>
                    <div class="space-x-3">
                        <button type="submit" form="edit-item-form" id="save-button" class="py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition hidden">
                            <i class="fas fa-save mr-2"></i>Save Changes
                        </button>
                        <button type="button" onclick="closeModal()" class="py-2 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- JavaScript Logic -->
        <script>
            const API_URL = '/api/items';
            let inventoryData = [];
            let sortDirection = 1; // 1 for ASC, -1 for DESC
            let sizeRowCounter = 0; // For unique IDs for costume size rows
            let currentView = 'list'; // 'list' or 'grid'

            let currentItemData = null;

            function showItemDetails(item) {
                // Store current item data globally for use by other functions
                currentItemData = item;

                const modal = document.getElementById('detail-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                // Set Edit Mode to read-only initially
                toggleEditMode(false);

                // Get all form elements
                document.getElementById('edit-item-id').value = item.id;
                document.getElementById('edit-asset-type').value = item.asset_type;
                document.getElementById('edit-storage-location').value = item.storage_location || '';
                document.getElementById('edit-notes').value = item.notes || '';

                // Set common display data
                const titleElement = document.getElementById('modal-title-main');
                const typeElement = document.getElementById('modal-asset-type');
                const statusBadge = document.getElementById('modal-status-badge');
                const photoElement = document.getElementById('modal-photo');
                const detailsContainer = document.getElementById('modal-specific-details');

                const statusClass = item.status === 'Available' ? 'available-status' : 'checked-out-status';
                const assetIcon = getAssetIcon(item.asset_type);

                typeElement.innerHTML = `<i class="fas ${assetIcon} mr-1"></i> ${item.asset_type}`;
                statusBadge.className = `px-3 py-1 text-sm font-semibold rounded-full w-fit ${statusClass}`;
                statusBadge.textContent = item.status;
                photoElement.src = item.photo_url || 'https://placehold.co/96x96/cccccc/333333?text=No+Photo';

                let detailsHtml = '';

                // Set specific data based on asset type
                if (item.asset_type === 'Costume') {
                    titleElement.textContent = `${item.type_of_clothing} (${item.gender})`;

                    // Render size inventory for Costumes (with editable inputs and dynamic buttons)
                    detailsHtml = `
                        <p><span class="font-medium">Clothing Type:</span> ${item.type_of_clothing}</p>
                        <p><span class="font-medium">Gender:</span> ${item.gender}</p>
                        <div class="mt-3 space-y-2">
                            <p class="font-medium border-b pb-1">Size Inventory (Size | Quantity):</p>
                            <div id="edit-size-inventory-fields">
                            ${item.size_inventory.map((i, index) => `
                                <div class="flex space-x-2 items-center" id="edit-size-row-${item.id}-${index}">
                                    <input type="text" value="${i.size}" name="size" class="w-1/3 p-1.5 text-xs rounded-lg border-gray-300 border bg-white read-mode" disabled>
                                    <i class="fas fa-times text-gray-400"></i>
                                    <input type="number" value="${i.count}" name="count" min="0" class="w-1/3 p-1.5 text-xs rounded-lg border-gray-300 border bg-white read-mode" disabled>
                                    <button type="button" onclick="removeEditCostumeSizeRow('edit-size-row-${item.id}-${index}')" 
                                            class="text-red-500 hover:text-red-700 p-1 text-base h-8 w-8 rounded-full remove-size-button read-mode" disabled style="display: none;">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            `).join('')}
                            </div>
                        </div>
                        <button type="button" id="add-edit-size-button" onclick="addEditCostumeSizeRow()" 
                                class="mt-2 text-indigo-600 hover:text-indigo-800 text-sm font-medium read-mode" disabled style="display: none;">
                            <i class="fas fa-plus-circle mr-1"></i> Add New Size/Number
                        </button>
                    `;
                } else if (item.asset_type === 'Prop' || item.asset_type === 'Set' || item.asset_type === 'Tech') {
                    titleElement.textContent = item.name;

                    // Render quantity for Prop/Set/Tech (with editable input)
                    detailsHtml = `
                        <p><span class="font-medium">Name:</span> ${item.name}</p>
                        <p><span class="font-medium">Category:</span> ${item.asset_type}</p>
                        <div class="flex items-center space-x-2">
                            <label for="edit-number" class="font-medium">Quantity:</label>
                            <input type="number" id="edit-number" name="number" value="${item.number}" min="1" class="w-1/4 p-1.5 text-sm rounded-lg border-gray-300 border bg-white read-mode" disabled>
                        </div>
                    `;
                }

                detailsContainer.innerHTML = detailsHtml;
            }

            function toggleEditMode(isEditing) {
                const editButton = document.getElementById('edit-button');
                const saveButton = document.getElementById('save-button');
                const editableFields = document.querySelectorAll('.read-mode');

                const addSizeButton = document.getElementById('add-edit-size-button');
                const removeRowButtons = document.querySelectorAll('.remove-size-button');

                if (isEditing) {
                    editButton.classList.add('hidden');
                    saveButton.classList.remove('hidden');
                    editableFields.forEach(field => {
                        field.removeAttribute('disabled');
                        field.classList.remove('bg-white');
                        field.classList.add('bg-indigo-50');
                    });

                    // Show the main Add Size button
                    if (addSizeButton) {
                        addSizeButton.style.display = 'inline-block';
                        addSizeButton.removeAttribute('disabled');
                    }

                    // Show individual size row delete buttons
                    removeRowButtons.forEach(btn => {
                        btn.style.display = 'inline-block';
                        btn.removeAttribute('disabled');
                    });

                } else {
                    editButton.classList.remove('hidden');
                    saveButton.classList.add('hidden');
                    editableFields.forEach(field => {
                        field.setAttribute('disabled', 'disabled');
                        field.classList.remove('bg-indigo-50');
                        field.classList.add('bg-white');
                    });

                    // Hide the main Add Size button
                    if (addSizeButton) {
                        addSizeButton.style.display = 'none';
                    }

                    // Hide individual size row delete buttons
                    removeRowButtons.forEach(btn => {
                        btn.style.display = 'none';
                    });

                    // If new rows were added but not saved, remove them upon exiting edit mode
                    document.querySelectorAll('.added-row').forEach(row => row.remove());
                }
            }

            function closeModal() {
                // Reset edit mode when closing
                toggleEditMode(false);
                const modal = document.getElementById('detail-modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            window.closeModal = closeModal;
            window.showItemDetails = showItemDetails;


            // --- Edit Item Submission Handler ---

            document.getElementById('edit-item-form').addEventListener('submit', async function(e) {
                e.preventDefault();

                const itemId = document.getElementById('edit-item-id').value;
                const assetType = document.getElementById('edit-asset-type').value;

                const formData = new FormData(this);

                // For Costumes, re-assemble size inventory
                if (assetType === 'Costume') {
                    const sizes = formData.getAll('size');
                    const counts = formData.getAll('count');
                    const sizeInventory = sizes.map((size, index) => ({
                        size: size,
                        count: parseInt(counts[index]) || 0
                    }));
                    formData.delete('size');
                    formData.delete('count');
                    formData.append('size_inventory', JSON.stringify(sizeInventory));
                }

                // Convert FormData to JSON object for the PUT request body
                const updateData = {};
                for (const [key, value] of formData.entries()) {
                    updateData[key] = value;
                }

                try {
                    const response = await fetch(`/api/items/${itemId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            // Reuse the same manager key header from your add logic if needed
                            'X-Manager-Key': localStorage.getItem('managerKey')
                        },
                        body: JSON.stringify(updateData)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        showNotification(data.message, 'success');

                        // Re-fetch and re-render the inventory list
                        await fetchInventory();
                        closeModal();
                    } else {
                        const errorData = await response.json();
                        showNotification(errorData.error || 'Failed to update asset.', 'error');
                    }
                } catch (error) {
                    console.error('Error submitting edit:', error);
                    showNotification('An unexpected network error occurred during update.', 'error');
                }
            });

            // --- Utility Functions ---

            function showNotification(message, type = 'success') {
                const box = document.getElementById('notification-area');
                const notification = document.createElement('div');

                let bgColor, textColor, icon;

                if (type === 'success') {
                    bgColor = 'bg-green-500';
                    textColor = 'text-white';
                    icon = 'fas fa-check-circle';
                } else if (type === 'error') {
                    bgColor = 'bg-red-600';
                    textColor = 'text-white';
                    icon = 'fas fa-exclamation-triangle';
                } else {
                    bgColor = 'bg-indigo-500';
                    textColor = 'text-white';
                    icon = 'fas fa-info-circle';
                }

                notification.className = `notification p-3 rounded-lg shadow-xl flex items-center ${bgColor} ${textColor} text-sm opacity-100`;
                notification.innerHTML = `
                    <i class="${icon} mr-3"></i>
                    <span>${message}</span>
                `;

                box.prepend(notification); // Add new notifications to the top

                // Automatically remove the notification after 5 seconds
                setTimeout(() => {
                    notification.style.opacity = '0';
                    setTimeout(() => notification.remove(), 500);
                }, 5000);
            }

            // Helper function to render Font Awesome icons for asset types
            function getAssetIcon(assetType) {
                const icons = {
                    'Costume': 'fa-tshirt',
                    'Prop': 'fa-hat-wizard',
                    'Set': 'fa-couch',
                    'Tech': 'fa-code-branch'
                };
                return icons[assetType] || 'fa-box';
            }

            async function updateStatusHandler(e, itemId, currentStatus) {
                if (e && e.stopPropagation) {
                    e.stopPropagation();
                }

                let newStatus, checkedOutTo = null;

                if (currentStatus === 'Available') {
                    // PROMPT FOR CHECKOUT LOCATION/NAME
                    checkedOutTo = prompt("Checking item out. Enter the name or location it is checked out to:");

                    if (!checkedOutTo || checkedOutTo.trim() === "") {
                        showNotification('Checkout cancelled: Name or location is required.', 'error');
                        return;
                    }
                    newStatus = 'Checked Out';
                } else {
                    // MODIFIED: No confirmation needed when returning item
                    newStatus = 'Available';
                }

                const updateData = {
                    status: newStatus
                };

                if (checkedOutTo) {
                    updateData.checked_out_to = checkedOutTo.trim();
                }

                try {
                    const response = await fetch(`/api/items/${itemId}/status`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Manager-Key': localStorage.getItem('managerKey')
                        },
                        body: JSON.stringify(updateData)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        showNotification(data.message, 'success');
                        await fetchInventory(); // Refresh the list
                    } else {
                        const errorData = await response.json();
                        showNotification(errorData.error || `Failed to change status to ${newStatus}.`, 'error');
                    }
                } catch (error) {
                    console.error('Error updating status:', error);
                    showNotification('An unexpected network error occurred during status update.', 'error');
                }
            }
            window.updateStatusHandler = updateStatusHandler;

            let uniqueCostumeTypes = new Set();
            let uniqueGenders = new Set();

            // Function to collect unique filter options (call this in fetchInventory)
            function collectFilterOptions() {
                uniqueCostumeTypes.clear();
                uniqueGenders.clear();

                inventoryData.filter(item => item.asset_type === 'Costume').forEach(item => {
                    if (item.type_of_clothing) uniqueCostumeTypes.add(item.type_of_clothing);
                    if (item.gender) uniqueGenders.add(item.gender);
                });
            }

            // Function to dynamically show/hide filter dropdowns based on asset type
            function displayFilterOptions() {
                const assetType = document.getElementById('filter-asset-type').value;
                const container = document.getElementById('dynamic-filters-container');
                container.innerHTML = '';

                if (assetType === 'Costume') {
                    let html = '';

                    // 1. Costume Type Dropdown
                    html += `
                        <div class="w-full md:w-auto">
                            <label for="filter-type" class="block text-xs font-medium text-gray-700">Type</label>
                            <select id="filter-type" onchange="filterAndSortInventory()"
                                    class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white mt-1 w-full md:w-auto">
                                <option value="All">All Types</option>
                                ${Array.from(uniqueCostumeTypes).sort().map(type => `<option value="${type}">${type}</option>`).join('')}
                            </select>
                        </div>
                    `;

                    // 2. Gender Dropdown
                    html += `
                        <div class="w-full md:w-auto">
                            <label for="filter-gender" class="block text-xs font-medium text-gray-700">Gender</label>
                            <select id="filter-gender" onchange="filterAndSortInventory()"
                                    class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white mt-1 w-full md:w-auto">
                                <option value="All">All Genders</option>
                                ${Array.from(uniqueGenders).sort().map(gender => `<option value="${gender}">${gender}</option>`).join('')}
                            </select>
                        </div>
                    `;

                    container.innerHTML = html;
                }
            }
            window.displayFilterOptions = displayFilterOptions;

            // --- Dynamic Form Rendering ---

            function addCostumeSizeRow() {
                sizeRowCounter++;
                const container = document.getElementById('size-inventory-rows');
                const row = document.createElement('div');
                row.className = 'flex space-x-2 items-end mb-2 border-t pt-2';
                row.id = `size-row-${sizeRowCounter}`;
                row.innerHTML = `
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-gray-600">Size</label>
                        <input type="text" name="size" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-1.5 text-sm border">
                    </div>

            function exportInventory() {
                const managerKey = localStorage.getItem('managerKey') || '';

                // Create a temporary link element
                const link = document.createElement('a');

                // The browser will automatically handle the download when navigating to this URL
                link.href = '/api/export';

            async function fetchInventory() {
                const initialLoad = inventoryData.length === 0;
                const loadingIndicator = document.getElementById('loading-indicator');

                if (initialLoad && loadingIndicator) {
                    loadingIndicator.style.display = 'flex';
                }

                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    inventoryData = data;

                    collectFilterOptions();
                    displayFilterOptions();

                    filterAndSortInventory(); // Use the consolidated filter/sort function
                } catch (error) {
                    console.error('Failed to fetch inventory:', error);
                    showNotification('Could not load inventory data. Check server connection and API.', 'error');
                    const list = document.getElementById('inventory-list');
                    if (list) {
                        list.innerHTML = `
                            <p class="text-red-600 p-4 bg-red-50 rounded-lg">Error loading data. Is the Flask API running?</p>
                        `;
                    }
                } finally {
                    if (loadingIndicator) {
                        loadingIndicator.style.display = 'none';
                    }
                }
            }

            function filterAndSortInventory() {
                const assetTypeFilter = document.getElementById('filter-asset-type').value;
                const sortBy = document.getElementById('sort-by-button').value;

                let filteredItems = inventoryData.filter(item => {
                    // 1. Filter by Asset Type (Always required)
                    if (assetTypeFilter !== 'All' && item.asset_type !== assetTypeFilter) {
                        return false;
                    }

                    // 2. Dynamic Filters for Costume
                    if (assetTypeFilter === 'Costume') {
                        const costumeTypeFilter = document.getElementById('filter-type')?.value || 'All';
                        const genderFilter = document.getElementById('filter-gender')?.value || 'All';

                        if (costumeTypeFilter !== 'All' && item.type_of_clothing !== costumeTypeFilter) {
                            return false;
                        }
                        if (genderFilter !== 'All' && item.gender !== genderFilter) {
                            return false;
                        }
                    }

                    // All other asset types (Prop, Set, Tech) automatically pass if the main filter passes
                    return true;
                });

                // --- Sorting ---
                filteredItems.sort((a, b) => {
                    const primaryIdentifierA = a.asset_type === 'Costume' 
                        ? `${a.type_of_clothing} ${a.gender}` 
                        : a.name || a.asset_type;
                    const primaryIdentifierB = b.asset_type === 'Costume' 
                        ? `${b.type_of_clothing} ${b.gender}` 
                        : b.name || b.asset_type;

                    // Sorting by Name (A-Z or Z-A)
                    if (sortBy.startsWith('name')) {
                        const comparison = primaryIdentifierA.localeCompare(primaryIdentifierB);
                        return sortBy === 'name_asc' ? comparison : -comparison;
                    }

                    // Sorting by Quantity (For Prop, Set, Tech)
                    if (sortBy.startsWith('quantity')) {
                        const quantityA = a.asset_type === 'Costume' 
                            ? a.size_inventory.reduce((sum, entry) => sum + parseInt(entry.count || 0), 0)
                            : (a.number || 0);
                        const quantityB = b.asset_type === 'Costume' 
                            ? b.size_inventory.reduce((sum, entry) => sum + parseInt(entry.count || 0), 0)
                            : (b.number || 0);

                        const comparison = quantityA - quantityB;
                        return sortBy === 'quantity_asc' ? comparison : -comparison;
                    }

                    // Default: Sort by Name ASC
                    return primaryIdentifierA.localeCompare(primaryIdentifierB);
                });

                renderInventoryList(filteredItems);
            }

            // --- Event Handlers ---

            // 1. Add Item
            document.getElementById('add-item-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const submitButton = document.getElementById('add-item-button');
                const originalButtonText = submitButton.innerHTML;
                const assetType = formData.get('asset_type');

                if (!assetType) {
                    showNotification('Please select an Asset Type.', 'error');
                    return;
                }

                // Basic validation for Costume Size Inventory
                if (assetType === 'Costume') {
                    const sizes = formData.getAll('size');
                    const counts = formData.getAll('count');
                    if (sizes.length === 0 || sizes.some(s => s.trim() === '') || counts.some(c => parseInt(c) < 1)) {
                        showNotification('Costumes require at least one Size and Number entry, with Number > 0.', 'error');
                        return;
                    }
                }


                submitButton.disabled = true;
                submitButton.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Adding...`;

                try {
                    // POST to /api/items
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    }

                    const newItem = await response.json();

                    showNotification(`Successfully added asset: ${newItem.asset_type}!`);

                    // Refresh data and UI
                    await fetchInventory();

                    // Clear the form fields and reset dynamic fields
                    form.reset();
                    displayDynamicFields();

                } catch (error) {
                    console.error('Error adding item:', error);
                    showNotification(error.message || 'An unknown error occurred while adding the asset.', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalButtonText;
                }
            });

            // 2. Status Toggle (Check Out/Return)
            async function handleStatusToggle(itemId, currentStatus) {
                const newStatus = currentStatus === 'Available' ? 'Checked Out' : 'Available';

                try {
                    const response = await fetch(`${API_URL}/${itemId}/status`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    }

                    await fetchInventory();
                    showNotification(`Asset status updated to ${newStatus}.`);

                } catch (error) {
                    console.error('Error updating status:', error);
                    showNotification(error.message || 'Failed to update asset status.', 'error');
                }
            }
            window.handleStatusToggle = handleStatusToggle;

            // 3. Delete Item
            async function handleDelete(itemId, itemName) {
                // Replaced the undefined showConfirmationModal with the native confirm() dialog.
                const confirmed = confirm(`Are you absolutely sure you want to permanently delete "${itemName}"? This action cannot be reversed.`);

                if (!confirmed) return;

                try {
                    const response = await fetch(`${API_URL}/${itemId}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Unknown server error.' }));
                        throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                    }

                    await fetchInventory();
                    showNotification(`Successfully deleted asset: ${itemName}.`, 'error');

                } catch (error) {
                    console.error('Error deleting item:', error);
                    showNotification(error.message || 'Failed to delete asset.', 'error');
                }
            }
            window.handleDelete = handleDelete;

            // 4. Sort Button
            document.getElementById('sort-by-button').addEventListener('click', () => {
                sortDirection *= -1; // Toggle direction
                const icon = document.querySelector('#sort-by-button i');
                icon.className = sortDirection === 1 ? 'fas fa-sort-alpha-down ml-1' : 'fas fa-sort-alpha-up-alt ml-1';

                filterAndSortInventory();
            });

            // 5. Filters/Search Input
            document.getElementById('filter-asset-type').addEventListener('change', filterAndSortInventory);

            function updateView(view) {
                currentView = view;
                const listButton = document.getElementById('view-list-button');
                const gridButton = document.getElementById('view-grid-button');

                if (view === 'list') {
                    listButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition';
                    gridButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition';
                } else {
                    gridButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition';
                    listButton.className = 'flex-shrink-0 py-2 px-3 border border-indigo-200 rounded-lg shadow-sm text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition';
                }
                filterAndSortInventory(); // Re-render the list with the new view
            }

            document.getElementById('view-list-button').addEventListener('click', () => updateView('list'));
            document.getElementById('view-grid-button').addEventListener('click', () => updateView('grid'));

            // --- Initial Load ---
            fetchInventory();
            displayDynamicFields(); // Initialize form state
        </script>
